name: Data Science Job Alert

on:
  workflow_dispatch: {}  # triggered every 10 min by an external cron-job.org
                          # job calling this via GitHub's API — see README.
                          # GitHub's own native `schedule:` trigger proved
                          # unreliable (would silently stop firing for many
                          # hours, especially after any edit to this file),
                          # so we no longer rely on it.

# Ensures only one run of this workflow executes at a time. If a manual
# trigger and a scheduled tick land close together, the second one waits
# for the first to finish (including its push) instead of racing it.
concurrency:
  group: job-alert-state
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state files

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check active hours
        id: hours
        run: |
          hour=$(date -u +%H)
          # 9am-11pm CEST = 7-20 UTC (Berlin summer time). When Germany
          # switches to CET in late October, change 7/20 to 6/19 below
          # to keep the same local window.
          if [ "$hour" -ge 7 ] && [ "$hour" -le 20 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Within active hours (UTC hour: $hour)."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside active hours (UTC hour: $hour) — skipping this run."
          fi

      - name: Check out repo
        if: steps.hours.outputs.active == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.hours.outputs.active == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hours.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: Run job alert script
        if: steps.hours.outputs.active == 'true'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit updated state
        if: steps.hours.outputs.active == 'true'
        run: |
          echo "--- state file on disk after script ran ---"
          cat state/combined.json
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"

          # Merge with whatever's currently on the remote at the JSON
          # level (max timestamp, union of recent_ids) rather than
          # relying on git's line-based rebase/merge — two runs can each
          # append DIFFERENT new job IDs to the same array, which git's
          # text merge sees as a genuine conflict (it has no idea this
          # is just "two sets of additions"). A stuck rebase conflict
          # previously left state updates lost entirely, since the retry
          # loop had no way to recover from a half-applied rebase.
          for attempt in 1 2 3; do
            git fetch origin main
            if git show origin/main:state/combined.json > /tmp/remote_state.json 2>/dev/null; then
              python3 merge_state.py /tmp/remote_state.json state/combined.json state/combined.json
              echo "--- merged state (attempt $attempt) ---"
              cat state/combined.json
            fi

            git add state/
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "Update job alert state [skip ci]"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed (remote moved again) — undoing local commit and retrying merge..."
            git reset --soft HEAD~1
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1
