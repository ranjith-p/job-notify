name: Data Science Job Alert

on:
  schedule:
    # Every 10 minutes. This exact syntax is the one confirmed to fire
    # reliably in testing — both the offset minute-list and the hour-range
    # variants caused the schedule to stop triggering for many hours, so
    # sticking with the simplest proven form here. The 9am-11pm active-hours
    # check happens inside the job itself (see "Check active hours" step
    # below) rather than in the cron expression.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

# Ensures only one run of this workflow executes at a time. If a manual
# trigger and a scheduled tick land close together, the second one waits
# for the first to finish (including its push) instead of racing it.
concurrency:
  group: job-alert-state
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state files

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check active hours
        id: hours
        run: |
          hour=$(date -u +%H)
          # 9am-11pm CEST = 7-20 UTC (Berlin summer time). When Germany
          # switches to CET in late October, change 7/20 to 6/19 below
          # to keep the same local window.
          if [ "$hour" -ge 7 ] && [ "$hour" -le 20 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Within active hours (UTC hour: $hour)."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside active hours (UTC hour: $hour) — skipping this run."
          fi

      - name: Check out repo
        if: steps.hours.outputs.active == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.hours.outputs.active == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hours.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: Run job alert script
        if: steps.hours.outputs.active == 'true'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit updated state
        if: steps.hours.outputs.active == 'true'
        run: |
          echo "--- state files on disk after script ran ---"
          cat state/germany.json
          cat state/berlin.json
          echo "--- git status before add ---"
          git status
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add state/
          echo "--- git status after add ---"
          git status
          echo "--- git diff --cached ---"
          git diff --cached
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update job alert state [skip ci]"

          # Retry pull-rebase + push a few times in case another run's
          # push landed in the same narrow window.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1
