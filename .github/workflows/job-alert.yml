name: Data Science Job Alert

on:
  schedule:
    # Every 10 minutes, offset from round numbers to avoid GitHub's
    # peak-load scheduling delays at :00, :10, :20, etc.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

# Ensures only one run of this workflow executes at a time. If a manual
# trigger and a scheduled tick land close together, the second one waits
# for the first to finish (including its push) instead of racing it.
concurrency:
  group: job-alert-state
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state files

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert script
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update job alert state [skip ci]"

          # Retry pull-rebase + push a few times in case another run's
          # push landed in the same narrow window.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts."
          exit 1
