name: LinkedIn Job Alert

on:
  workflow_dispatch: {}  # triggered by an external cron-job.org job calling
                          # this via GitHub's API — see README. Use a LOWER
                          # frequency than the Adzuna workflow's: this hits
                          # LinkedIn's public, unauthenticated endpoint from a
                          # GitHub-hosted (datacenter) IP, which is more likely
                          # to get rate-limited/CAPTCHA'd than a residential
                          # IP at high frequency. Hourly is a reasonable start.

# Ensures only one run of THIS workflow executes at a time. A distinct group
# from job-alert.yml's "job-alert-state" — the two workflows touch different
# state files and can safely run concurrently with each other.
concurrency:
  group: linkedin-alert-state
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state files

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check active hours
        id: hours
        run: |
          hour=$(date -u +%H)
          # 9am-11pm CEST = 7-20 UTC (Berlin summer time). When Germany
          # switches to CET in late October, change 7/20 to 6/19 below
          # to keep the same local window.
          if [ "$hour" -ge 7 ] && [ "$hour" -le 20 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Within active hours (UTC hour: $hour)."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside active hours (UTC hour: $hour) — skipping this run."
          fi

      - name: Check out repo
        if: steps.hours.outputs.active == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.hours.outputs.active == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hours.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: Run LinkedIn alert script
        if: steps.hours.outputs.active == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python linkedin_alert.py

      - name: Commit updated state
        if: steps.hours.outputs.active == 'true'
        run: |
          echo "--- state file on disk after script ran ---"
          cat state/linkedin.json
          git config user.name "linkedin-alert-bot"
          git config user.email "actions@github.com"

          # Merge with whatever's currently on the remote at the JSON
          # level (max timestamp, union of recent_ids) rather than
          # relying on git's line-based rebase/merge — two runs can each
          # append DIFFERENT new job IDs to the same array, which git's
          # text merge sees as a genuine conflict (it has no idea this
          # is just "two sets of additions"). A stuck rebase conflict on
          # the Adzuna side previously left state updates lost entirely,
          # since a simple retry loop had no way to recover from a
          # half-applied rebase — same fix applied here for consistency,
          # even though this workflow's own concurrency group makes a
          # same-workflow race less likely than it was for job-alert.yml.
          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git show origin/main:state/linkedin.json > /tmp/remote_state.json 2>/dev/null; then
              python3 merge_state.py /tmp/remote_state.json state/linkedin.json /tmp/merged_state.json 3000
            else
              cp state/linkedin.json /tmp/merged_state.json
            fi

            # Catch local HEAD up to the actual current remote tip —
            # this is what makes the next commit a legitimate
            # fast-forward instead of racing a moving target.
            git reset --hard origin/main
            cp /tmp/merged_state.json state/linkedin.json

            echo "--- merged state (attempt $attempt) ---"
            cat state/linkedin.json

            git add state/linkedin.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "Update LinkedIn alert state [skip ci]"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed (remote moved again) — retrying with fresh merge..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 5 attempts."
          exit 1
